<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URA - TIN Registration Portal</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>

    <header class="portal-header">
        <div class="header-container">
            <img src="/images/logo.png" 
            alt="Uganda Revenue Authority Logo" class="ura-logo">
            <h1>TIN Registration Portal</h1>
        </div>
    </header>

    <div class="info-bar">
        <p>Have your National ID ready before starting.</p>
    </div>

    <main class="portal-container">
        <form action="#" method="POST" enctype="multipart/form-data">
            
            <div class="taxpayer-toggle-group">
                <input type="radio" id="individual" name="taxpayer_type" value="individual" checked>
                <label for="individual" class="toggle-btn">Individual Taxpayer</label>

                <input type="radio" id="business" name="taxpayer_type" value="business">
                <label for="business" class="toggle-btn">Business Entity</label>
            </div>

            <fieldset class="form-section">
                <legend>Section A: Individual Taxpayer Details</legend>

                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full_name" required>
                </div>

                <div class="form-group">
                    <label for="nin">NIN (National Identification Number)</label>
                    <input type="text" id="nin" name="nin" maxlength="14" pattern="[A-Z]{2}[A-Z0-9]{12}" title="14 characters: Two capital letters followed by 12 capital letters or digits" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-group">
                    <label class="group-label">Gender</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="Male">
                        <label for="male">Male</label>

                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="district">District</label>
                    <select id="district" name="district">
                        <option value="">-- Select District --</option>
                        <option value="Kampala">Kampala</option>
                        <option value="Wakiso">Wakiso</option>
                        <option value="Mukono">Mukono</option>
                        <option value="Jinja">Jinja</option>
                        <option value="Mbarara">Mbarara</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="national-id-upload">Upload National ID</label>
                    <input type="file" id="national-id-upload" name="national_id_upload" accept=".jpg, .pdf">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-next">Next</button>
                </div>
            </fieldset>

        </form>
    </main>

</body>
</html>
